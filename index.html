<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om Kumbhar | Financial Analyst Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: #0f172a; /* Deep Navy */
            color: #f1f5f9; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* NAVIGATION */
        nav { 
            background: #1e293b; 
            padding: 20px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #38bdf8;
        }
        .logo { font-weight: 800; font-size: 1.5rem; color: #38bdf8; }
        nav ul { display: flex; gap: 20px; list-style: none; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        nav a:hover { color: #38bdf8; }

        /* SECTIONS */
        section { padding: 80px 8%; max-width: 1200px; margin: 0 auto; }
        
        /* HERO */
        .hero { 
            text-align: center; 
            padding: 100px 8%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; margin-bottom: 10px; }
        .hero h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
        .hero p { color: #94a3b8; max-width: 700px; margin: 0 auto 30px auto; }

        /* CARDS */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 40px;
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
