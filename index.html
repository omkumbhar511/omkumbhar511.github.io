        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        /* ADVANCED ANIMATED BACKGROUND */
        .bg-wrapper { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #020617; }

        .b1 { top: -10%; left: -10%; }
        .b2 { bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0,0) scale(1); } to { transform: translate(100px, 100px) scale(1.2); } }

        /* NAVIGATION */
        nav { position: fixed; top: 0; width: 100%; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }

        nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
        nav a:hover { color: var(--primary); }

        .hero p { max-width: 600px; color: var(--text-dim); font-size: 1.1rem; margin-bottom: 30px; }

        .btn-group { display: flex; gap: 15px; }
        .btn { padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; transition: 0.4s; cursor: pointer; border: none; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: #020617; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .section-title { font-size: 2.5rem; margin-bottom: 50px; text-align: center; }
